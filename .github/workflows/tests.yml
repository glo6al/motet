name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    timeout-minutes: 40
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.x']      # the README promises 3.9 or later
        # Python 3.9 builds are unavailable on the newest Ubuntu image.
        exclude:
          - os: ubuntu-latest
            python: '3.9'
        include:
          - os: ubuntu-24.04
            python: '3.9'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}
      # Run every applicable check after a failure; failed checks keep the job red.
      - name: Report stock core test runtime
        if: ${{ !cancelled() }}
        run: python -c "import sqlite3, sys; print('Core tests use Python', sys.version.split()[0], 'SQLite', sqlite3.sqlite_version)"
      - name: Check ordinary cases in mixed suites on stock Python 3.9
        if: ${{ !cancelled() && matrix.python == '3.9' }}
        timeout-minutes: 5
        run: python tests/ci_python39.py --stock-core
      - name: Run parser and scanner checks
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: >-
          python -u -X faulthandler -c "import faulthandler, runpy; print('parser checks started', flush=True); faulthandler.dump_traceback_later(60, repeat=True); runpy.run_path('tests/test_parsers.py', run_name='__main__')"
      - run: python tests/test_app_icons.py
        if: ${{ !cancelled() }}
      - run: python tests/test_preview_walk.py
        if: ${{ !cancelled() }}
      - run: python tests/test_dictation_assets.py
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: python tests/test_dictation_runtime.py
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: python tests/test_dictation_helper.py
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: python tests/test_dictation_proxy.py
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # Dictation's private state, proxy read, model setup and helper stop on Windows: simulated on macOS and Linux,
      # against real access lists on Windows. No microphone, runtime or model download.
      - run: python tests/test_dictation_windows.py
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - name: Check dictation routes and nonce delivery over real local HTTP
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: python tests/test_dictation_server.py
      - name: Check synthetic dictation fixture without a microphone
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: python tests/test_dictation_fixture.py
      - run: python tests/test_native_sqlite_support.py
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: python tests/test_managed_sqlite_upgrade.py
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: python tests/test_officer_messaging.py
        if: ${{ !cancelled() }}
      - run: python tests/test_officer_routing.py
        if: ${{ !cancelled() }}
      - run: python tests/test_new_chat_service.py
        if: ${{ !cancelled() }}
      # Off on Windows: managed Claude (chats Motet starts) needs the Mac app, macOS identity and its pinned runner.
      - run: python tests/test_managed_new_chat_service.py
        if: ${{ !cancelled() && runner.os != 'Windows' }}
      - run: python tests/test_claude_managed_runner.py
        if: ${{ !cancelled() && runner.os != 'Windows' }}
      - run: python tests/test_claude_managed.py
        if: ${{ !cancelled() && runner.os != 'Windows' }}
      - run: python tests/test_managed_claude_integration.py
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        timeout-minutes: 5
      - run: python tests/test_managed_claude_http.py
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node docs/fixtures/new-chat/managed-fixture.test.mjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: python tests/test_new_chat_http.py
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: python tests/test_new_chat_folder_chooser.py
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: python tests/test_new_chat_inventory.py
        if: ${{ !cancelled() }}
      - run: python tests/test_codex_new_chat.py
        if: ${{ !cancelled() }}
      - run: python tests/test_new_chat_integration.py
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node --test docs/fixtures/new-chat/fixture.test.mjs
        if: ${{ !cancelled() }}
      - run: python tests/test_officer_controls.py
        if: ${{ !cancelled() }}
      - run: python tests/test_officer_fulfillment.py
        if: ${{ !cancelled() }}
      - run: python tests/test_officer_history.py
        if: ${{ !cancelled() }}
      - run: python tests/test_private_storage.py
        if: ${{ !cancelled() }}
      - run: python tests/test_deck_log.py
        if: ${{ !cancelled() }}
      - run: python tests/test_deck_log_integration.py
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: python tests/test_antigravity.py
        if: ${{ !cancelled() }}
      - run: python tests/test_check_privacy.py
        if: ${{ !cancelled() }}
      - run: python tests/test_windows_probe.py
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: python scripts/check_privacy.py --all
        if: ${{ !cancelled() }}
      - run: python tests/test_officer_memory.py
        if: ${{ !cancelled() }}
      - run: python tests/test_officer_models.py
        if: ${{ !cancelled() }}
      - run: python tests/test_officer_instructions.py
        if: ${{ !cancelled() }}
      - run: python tests/test_officer_evals.py
        if: ${{ !cancelled() }}
      - run: python tests/test_officer_policy.py
        if: ${{ !cancelled() }}
      - run: python tests/test_officer_usage.py
        if: ${{ !cancelled() }}
      - run: python tests/test_officer_accounting.py
        if: ${{ !cancelled() }}
      - run: python tests/test_anthropic_reporting.py
        if: ${{ !cancelled() }}
      - run: python tests/test_anthropic_reporting_integration.py
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: python tests/test_officer_request.py
        if: ${{ !cancelled() }}
      - run: python tests/test_officer_evidence.py
        if: ${{ !cancelled() }}
      - run: python tests/test_officer_capabilities.py
        if: ${{ !cancelled() }}
      - run: python tests/test_officer_answer_assessment.py
        if: ${{ !cancelled() }}
      - run: python tests/test_bridge_preflight.py
        if: ${{ !cancelled() }}
      - run: python tests/test_peer_lifecycle.py
        if: ${{ !cancelled() }}
      - run: python tests/test_peer_progress.py
        if: ${{ !cancelled() }}
      - run: python tests/test_peer_progress_store.py
        if: ${{ !cancelled() }}
      - run: python tests/test_peer_progress_projection.py
        if: ${{ !cancelled() }}
      - run: python tests/test_peer_admin.py
        if: ${{ !cancelled() }}
      - run: python tests/test_peer_hold_episodes.py
        if: ${{ !cancelled() }}
      - run: python tests/test_peer_held_admin.py
        if: ${{ !cancelled() }}
      - run: node tests/test_peer_held_page.js
        if: ${{ !cancelled() }}
      - run: python tests/test_watch_bridge_clear.py
        if: ${{ !cancelled() }}
      - run: python tests/test_peer_recovery.py
        if: ${{ !cancelled() }}
      - run: python tests/test_codex_transcript.py
        if: ${{ !cancelled() }}
      - run: python tests/test_peer_bridge.py
        if: ${{ !cancelled() }}
      - run: python tests/test_shared_bridge.py
        if: ${{ !cancelled() }}
      - run: python tests/test_chat_directory.py
        if: ${{ !cancelled() }}
      - run: python tests/test_watch_peer.py
        if: ${{ !cancelled() }}
      - run: python tests/test_install_antigravity_bridge.py
        if: ${{ !cancelled() }}
      - run: python tests/test_peer_inbox.py
        if: ${{ !cancelled() }}
      - run: python tests/test_peer_reply_delivery.py
        if: ${{ !cancelled() }}
      - run: python tests/test_watch_reply_hook.py
        if: ${{ !cancelled() }}
      - run: python tests/test_install_reply_hook.py
        if: ${{ !cancelled() }}
      - name: Check the portable Claude Code hook and both installer forms
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: python tests/test_hooks_portable.py
      - run: python tests/test_codex_desktop_control.py
        if: ${{ !cancelled() }}
      - run: python tests/test_codex_native_input.py
        if: ${{ !cancelled() }}
      - run: python tests/test_codex_model_settings.py
        if: ${{ !cancelled() }}
      - run: python tests/test_native_observation.py
        if: ${{ !cancelled() }}
      - run: python tests/test_claude_native_input.py
        if: ${{ !cancelled() }}
      - run: python tests/test_watch_claude_input.py
        if: ${{ !cancelled() }}
      - run: python tests/test_claude_mod.py
        if: ${{ !cancelled() }}
      - run: python tests/test_claude_global_integration.py
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: python tests/test_claude_channel.py
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: python tests/test_watch_claude.py
        if: ${{ !cancelled() }}
      # The adapter's dependencies install on every system. On Windows the adapter reads its credential only
      # through Motet's Python check (Node cannot read an access list); peer-credential.test.mjs starts it there
      # with a credential Python made private, and checks that one readable by everyone is refused.
      - run: npm --prefix integrations/claude ci --ignore-scripts --no-audit --no-fund
        if: ${{ !cancelled() }}
      - name: Check the bridge adapter reads its credential through Motet's Python check on Windows
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 5
        env:
          PYTHON: python
        run: node --test integrations/claude/peer-credential.test.mjs
      # Off on Windows: these drive the bridge end to end with POSIX private state (owner and mode bits), the older
      # Claude channel (scripts/watch_claude.py; its files are written by Node, which cannot make a Windows file
      # private) or the Antigravity inbox (macOS and Linux only). On Windows the bridge's directory, credential files,
      # adapter start-up and refusals are checked by test_chat_directory.py, test_private_storage.py,
      # test_watch_peer.py, test_peer_bridge.py, test_peer_recovery.py, test_watch_bridge_clear.py and
      # test_bridge_preflight.py above and the adapter step just above. Messaging Claude through the plugin is
      # covered on Windows by test_claude_mod.py and test_claude_global_integration.py above.
      - run: python tests/test_peer_refusal_compatibility.py -v
        if: ${{ !cancelled() && runner.os != 'Windows' }}
      - run: npm --prefix integrations/claude test
        if: ${{ !cancelled() && runner.os != 'Windows' }}
      - run: python tests/test_inbox_stdio.py
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        timeout-minutes: 5
      - run: python tests/test_claude_integration.py
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        timeout-minutes: 5
      - run: python tests/test_peer_integration.py
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        timeout-minutes: 5
      - run: python tests/test_codex_proven_end_integration.py -v
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        timeout-minutes: 5
      - run: python tests/test_claude_peer_integration.py
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        timeout-minutes: 5
      - run: python tests/test_claude_proven_end_integration.py -v
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        timeout-minutes: 5
      - run: python tests/test_peer_reply_integration.py
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        timeout-minutes: 5
      - run: npm --prefix integrations/claude-mod test
        if: ${{ !cancelled() }}
      - run: node tests/test_claude_mod_page.js
        if: ${{ !cancelled() }}
      - run: node tests/test_new_chat_client.js
        if: ${{ !cancelled() }}
      - run: node tests/test_app_marks.js
        if: ${{ !cancelled() }}
      - run: node tests/test_officer_evidence_ui.js
        if: ${{ !cancelled() }}
      - name: Check stock Python 3.9 and select attachment test runtime
        if: ${{ !cancelled() && matrix.python == '3.9' }}
        timeout-minutes: 5
        run: python tests/ci_python39.py
      - name: Report attachment test runtime
        if: ${{ !cancelled() }}
        run: python -c "import sqlite3, sys; print('Attachment tests use Python', sys.version.split()[0], 'SQLite', sqlite3.sqlite_version)"
      - run: python tests/test_officer_documents.py
        if: ${{ !cancelled() }}
      - run: python tests/test_officer_document_ledger.py
        if: ${{ !cancelled() }}
      - run: python tests/test_officer_document_transport.py
        if: ${{ !cancelled() }}
      - run: python tests/test_officer_document_intents.py
        if: ${{ !cancelled() }}
      - run: python tests/test_officer_document_projection.py
        if: ${{ !cancelled() }}
      - run: python tests/test_officer_document_coordinator.py
        if: ${{ !cancelled() }}
      - run: python tests/test_officer_document_replay.py
        if: ${{ !cancelled() }}
      - run: python tests/test_officer_document_policy.py
        if: ${{ !cancelled() }}
      - run: python tests/test_officer_document_auto.py
        if: ${{ !cancelled() }}
      - run: python tests/test_officer_document_deletion.py
        if: ${{ !cancelled() }}
      - run: python tests/test_officer_document_live_fixture.py
        if: ${{ !cancelled() }}
        timeout-minutes: 8
      - run: python tests/test_officer_document_page_embed.py
        if: ${{ !cancelled() }}
      - run: python tests/test_officer_document_page_routes.py
        if: ${{ !cancelled() }}
      - run: python tests/test_attachments_foundation.py
        if: ${{ !cancelled() }}
      - run: python tests/test_attachments_store_boundary.py
        if: ${{ !cancelled() }}
      # The store's Windows branch: simulated on macOS and Linux, and on Windows against real junctions, inherited
      # access lists, a file held open by another program and held folders.
      - run: python tests/test_attachments_windows_store.py
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: python tests/test_attachments_requests.py
        if: ${{ !cancelled() }}
      - run: python tests/test_attachments_owner_transport.py
        if: ${{ !cancelled() }}
      - run: python tests/test_attachments_owner_directory.py
        if: ${{ !cancelled() }}
      - run: python tests/test_attachments_catalogue.py
        if: ${{ !cancelled() }}
      - run: python tests/test_attachments_conversations.py
        if: ${{ !cancelled() }}
      - run: python tests/test_attachments_deletion_slots.py
        if: ${{ !cancelled() }}
      - run: python tests/test_attachments_officer_storage.py
        if: ${{ !cancelled() }}
      - run: python tests/test_attachments_preview_lifetime.py
        if: ${{ !cancelled() }}
      - run: python tests/test_attachments_materialize.py
        if: ${{ !cancelled() }}
      - run: python tests/test_attachments_relay.py
        if: ${{ !cancelled() }}
      - run: python tests/test_attachments_http.py
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: python tests/test_attachments_integration.py
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # On every system: what the page is told when the store is off (Windows, or a failed store) and that the
      # attachment modules import without fcntl.
      - run: python tests/test_attachments_availability.py
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # On Windows the composition's tests import and skip with their reason: they race managed Claude, which is
      # Mac-only, through POSIX fixtures. The Claude route on Windows is test_claude_attachment_integration.py.
      - run: python tests/test_attachments_native_composition.py
        if: ${{ !cancelled() }}
      # Off on Windows: this fixture-only deletion's tests build their workspaces with POSIX modes
      # (attachments_native_fixture). Removing a copy on Windows is tested in test_attachments_windows_materialize.py.
      - run: python tests/test_attachments_native_deletion.py
        if: ${{ !cancelled() && runner.os != 'Windows' }}
      - run: python tests/test_attachments_native_handoff.py
        if: ${{ !cancelled() }}
      - run: python tests/test_attachments_native_mirror.py
        if: ${{ !cancelled() }}
      - run: python tests/test_attachments_native_reads.py
        if: ${{ !cancelled() }}
      - run: python tests/test_attachments_offline_proof.py
        if: ${{ !cancelled() }}
      - run: python tests/test_attachments_owner_guards.py
        if: ${{ !cancelled() }}
      - run: python tests/test_attachments_owner_marker.py
        if: ${{ !cancelled() }}
      - run: python tests/test_attachments_owner_startup.py
        if: ${{ !cancelled() }}
      # The namespace fence and owner runtime on their Windows branch: simulated on macOS and Linux, for real on
      # Windows (a second process holding the lock, junctions, inherited access lists, a path in another case).
      - run: python tests/test_attachments_windows_namespace.py
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # Workspace copies and resource locks on their Windows branch: simulated on macOS and Linux, for real on Windows
      # (junctions, a workspace others can change, a copy held open, a lock held by another process).
      - run: python tests/test_attachments_windows_materialize.py
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: python tests/test_delivery_admission.py
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: python tests/test_delivery_admission_e2e.py
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: python tests/test_attachments_proof_generator.py
        if: ${{ !cancelled() }}
      # Off on Windows: the proof harness writes its own fixtures with POSIX folder descriptors (scripts/attachments_proof).
      - run: python tests/test_attachments_proof_harness.py
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        timeout-minutes: 5
      - run: python -m unittest discover -s tests -p test_attachments_workspace_lifetime.py   # its __main__ is a child-process helper
        if: ${{ !cancelled() }}
      - run: python tests/test_codex_attachment_adapter.py
        if: ${{ !cancelled() }}
      - run: python tests/test_codex_attachment_evidence.py
        if: ${{ !cancelled() }}
      # Off on Windows: Codex attachments need the Mac app and attachment storage needs the folder walk.
      - run: python tests/test_codex_attachment_live_evidence.py
        if: ${{ !cancelled() && runner.os != 'Windows' }}
      - run: python tests/test_codex_attachment_integration.py
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        timeout-minutes: 5
      # Off on Windows: the adapter's tests race managed Claude, which is Mac-only, through POSIX fixtures.
      - run: python tests/test_claude_attachment_adapter.py
        if: ${{ !cancelled() && runner.os != 'Windows' }}
      # The whole route to a Claude chat, on every system (on Windows with Git for Windows under Program Files).
      - run: python tests/test_claude_attachment_integration.py
        if: ${{ !cancelled() }}
        timeout-minutes: 10
      # Git for Windows, the workspace check and a whole copy with Git's proof: simulated on macOS and Linux.
      - run: python tests/test_attachments_windows_delivery.py
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      # On Windows these import and skip with their reason: they race managed Claude, which is Mac-only by design.
      - run: python tests/test_native_managed_namespace.py
        if: ${{ !cancelled() }}
      # Off on Windows: Python there has no IANA time-zone data unless the tzdata package is installed.
      - run: python tests/test_attachments_expiry_time.py
        if: ${{ !cancelled() && runner.os != 'Windows' }}
      - run: python tests/test_owner_actions.py
        if: ${{ !cancelled() }}
      - run: python tests/test_claude_peer_backend.py
        if: ${{ !cancelled() }}
      - run: node tests/test_page.js      # the page's path helpers, outside a browser
        if: ${{ !cancelled() }}
        timeout-minutes: 7
      - run: node tests/test_officer_documents_page.js
        if: ${{ !cancelled() }}
        timeout-minutes: 7
      - run: node tests/test_officer_documents_page_http.js
        if: ${{ !cancelled() }}
        timeout-minutes: 7
      - name: Check desktop stage message-box ownership
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: node tests/test_message_box.js
      - name: Check dictation controller without a microphone
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: node tests/test_dictation_page.js
      - name: Check shared composer dictation integration
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: node tests/test_dictation_integration.js
      - run: node --test docs/fixtures/attachments/fixture.test.mjs
        if: ${{ !cancelled() }}
      - name: Check attachment VM probe supervision contracts
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: node --test docs/fixtures/attachments/fixture-vm-probe.test.mjs
      - run: node tests/test_attachments_client.js
        if: ${{ !cancelled() }}
      # Off on Windows: these start POSIX-only Python fixtures (private folder modes, stopped by SIGINT). The Claude
      # route on Windows is tests/test_claude_attachment_integration.py.
      - run: node tests/test_claude_attachment_http.js
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        timeout-minutes: 5
      - run: node tests/test_native_agent_attachments_client.js
        if: ${{ !cancelled() }}
      # Off on Windows: a POSIX-only Python fixture, as above.
      - run: node tests/test_native_agent_attachments_http.js
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        timeout-minutes: 5
      - run: node tests/test_native_agent_attachments_journal.js
        if: ${{ !cancelled() }}
      - run: node tests/test_native_agent_attachments_page.js
        if: ${{ !cancelled() }}
      # Off on Windows: a POSIX-only Python fixture, as above.
      - run: node tests/test_native_agent_attachments_stage23_http.js
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        timeout-minutes: 5
      # On Windows each served check may take up to 3.5 minutes (startup, cleanup and the check), and four start the
      # fixture, so the limit leaves room for all of them.
      - run: node tests/test_officer_document_browser_faults.js
        if: ${{ !cancelled() }}
        timeout-minutes: 16
      - run: node tests/test_officer_document_pending.js
        if: ${{ !cancelled() }}
      - run: node tests/test_officer_documents_client.js
        if: ${{ !cancelled() }}
      - run: node tests/test_officer_documents_http.js
        if: ${{ !cancelled() }}
        timeout-minutes: 5
