name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.x']      # the README promises 3.9 or later
        # Python 3.9 builds are unavailable on the newest Ubuntu image.
        exclude:
          - os: ubuntu-latest
            python: '3.9'
        include:
          - os: ubuntu-24.04
            python: '3.9'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run parser and scanner checks
        timeout-minutes: 10
        run: >-
          python -u -X faulthandler -c "import faulthandler, runpy; print('parser checks started', flush=True); faulthandler.dump_traceback_later(60, repeat=True); runpy.run_path('tests/test_parsers.py', run_name='__main__')"
      - run: python tests/test_app_icons.py
      - run: python tests/test_officer_messaging.py
      - run: python tests/test_officer_routing.py
      - run: python tests/test_officer_documents.py
      - run: python tests/test_officer_document_ledger.py
      - run: python tests/test_officer_document_transport.py
      - run: python tests/test_officer_document_intents.py
      - run: python tests/test_officer_document_projection.py
      - run: python tests/test_officer_document_coordinator.py
      - run: python tests/test_officer_document_replay.py
      - run: python tests/test_officer_document_policy.py
      - run: python tests/test_officer_document_auto.py
      - run: python tests/test_officer_document_deletion.py
      - run: python tests/test_officer_document_live_fixture.py
      - run: python tests/test_officer_document_page_embed.py
      - run: python tests/test_officer_document_page_routes.py
      - run: python tests/test_new_chat_service.py
      - run: python tests/test_attachments_foundation.py
      - run: python tests/test_attachments_store_boundary.py
      - run: python tests/test_attachments_requests.py
      - run: python tests/test_attachments_owner_transport.py
      - run: python tests/test_attachments_owner_directory.py
      - run: python tests/test_attachments_catalogue.py
      - run: python tests/test_attachments_conversations.py
      - run: python tests/test_attachments_deletion_slots.py
      - run: python tests/test_attachments_officer_storage.py
      - run: python tests/test_attachments_preview_lifetime.py
      - run: python tests/test_attachments_materialize.py
      - run: python tests/test_attachments_relay.py
      - run: python tests/test_attachments_http.py
      - run: python tests/test_attachments_integration.py
      - run: python tests/test_attachments_native_composition.py
        if: runner.os != 'Windows'
      - run: python tests/test_attachments_native_deletion.py
        if: runner.os != 'Windows'
      - run: python tests/test_attachments_native_handoff.py
      - run: python tests/test_attachments_native_mirror.py
