name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    timeout-minutes: 40
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.x']      # the README promises 3.9 or later
        # Python 3.9 builds are unavailable on the newest Ubuntu image.
        exclude:
          - os: ubuntu-latest
            python: '3.9'
        include:
          - os: ubuntu-24.04
            python: '3.9'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}
      # Run every applicable check after a failure; failed checks keep the job red.
      - name: Report stock core test runtime
        if: ${{ !cancelled() }}
        run: python -c "import sqlite3, sys; print('Core tests use Python', sys.version.split()[0], 'SQLite', sqlite3.sqlite_version)"
      - name: Check ordinary cases in mixed suites on stock Python 3.9
        if: ${{ !cancelled() && matrix.python == '3.9' }}
        timeout-minutes: 5
        run: python tests/ci_python39.py --stock-core
      - name: Run parser and scanner checks
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: >-
          python -u -X faulthandler -c "import faulthandler, runpy; print('parser checks started', flush=True); faulthandler.dump_traceback_later(60, repeat=True); runpy.run_path('tests/test_parsers.py', run_name='__main__')"
      - run: python tests/test_app_icons.py
        if: ${{ !cancelled() }}
      - run: python tests/test_native_sqlite_support.py
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: python tests/test_managed_sqlite_upgrade.py
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: python tests/test_officer_messaging.py
        if: ${{ !cancelled() }}
      - run: python tests/test_officer_routing.py
        if: ${{ !cancelled() }}
      - run: python tests/test_new_chat_service.py
        if: ${{ !cancelled() }}
      - run: python tests/test_managed_new_chat_service.py
        if: ${{ !cancelled() && runner.os != 'Windows' }}
      - run: python tests/test_claude_managed_runner.py
        if: ${{ !cancelled() && runner.os != 'Windows' }}
      - run: python tests/test_claude_managed.py
        if: ${{ !cancelled() && runner.os != 'Windows' }}
      - run: python tests/test_managed_claude_integration.py
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        timeout-minutes: 5
      - run: python tests/test_managed_claude_http.py
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node docs/fixtures/new-chat/managed-fixture.test.mjs
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: python tests/test_new_chat_http.py
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: python tests/test_new_chat_inventory.py
        if: ${{ !cancelled() }}
      - run: python tests/test_codex_new_chat.py
        if: ${{ !cancelled() }}
      - run: python tests/test_new_chat_integration.py
        if: ${{ !cancelled() }}
        timeout-minutes: 5
      - run: node --test docs/fixtures/new-chat/fixture.test.mjs
        if: ${{ !cancelled() }}
      - run: python tests/test_officer_controls.py
        if: ${{ !cancelled() }}
      - run: python tests/test_officer_fulfillment.py
        if: ${{ !cancelled() }}
